version: "3.8"

# Ingestion (Kafka), serving store (Postgres) and orchestration (Airflow).
# The streaming/batch source simulators, the Spark speed layer and the API
# run on the host with `python`/`spark-submit`/`uvicorn` - same pattern as
# the Chapter 3 Kafka assignment - so you can see their logs directly and
# iterate quickly. See README.md for the full run order.
#
# Start with:  docker compose up -d
# Stop with:   docker compose down -v
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fleet-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    container_name: fleet-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./storage/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: fleet-airflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fleet:fleet@postgres/fleet
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      PYTHONPATH: /opt/airflow/project
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - .:/opt/airflow/project
      - ./airflow_dags:/opt/airflow/dags
    command: >
      bash -c "set -e;
               pip install --no-cache-dir -q psycopg2-binary==2.9.9 pandas==2.2.2 pyarrow==17.0.0;
               airflow db migrate;
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true;
               airflow scheduler &
               exec airflow webserver"

volumes:
  kafka-data:
  postgres-data:
